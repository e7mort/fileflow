# GitHub Pages deploy for the built app.
#
# Actions cannot create the Pages site. `configure-pages` with
# enablement: true fails here with "Resource not accessible by integration"
# while GET /repos/e7mort/fileflow/pages is 404.
# A human must click Settings → Pages → Build and deployment →
# Source: GitHub Actions. Until then https://e7mort.github.io/fileflow/
# is not live. This workflow only runs on main so PRs stay green.
name: GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
