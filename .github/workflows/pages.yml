# GitHub Pages deploy. `enablement: true` asks GitHub to create the Pages
# site if it is missing. That still does not replace a human click:
# Settings → Pages → Build and deployment → Source: GitHub Actions.
# Until that is set, GET /repos/e7mort/fileflow/pages is 404 and
# https://e7mort.github.io/fileflow/ is not a live demo.
name: GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/client-acquisition-system-ee0c

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
